# profiles.yaml
# ---------------------------------------------------------------------------
# Corpora and purpose-specific voice skills.
#
# CORPORA. Each author's documents live in their own workspace,
# corpora/<name>/ (gitignored: state, notes, stripped text, prompts, archive,
# overrides, validation). A corpus entry sets the domain: which document types
# are valid, which nine-dimension rubric extraction reads against, which
# extraction instructions are used, and whether extraction reads one document
# per subagent (per_document) or the whole pending set in one subagent (batch).
#
# PROFILES. Each profile is a narrow SKILL.md aimed at one writing context and
# built from one corpus. skill.py uses the selected profile to:
#   - pick its corpus                                      (corpus)
#   - filter that corpus to the relevant document types    (corpus_types)
#   - pick the synthesis instructions and output format    (synthesis_template,
#                                                           skill_template)
#   - decide where the built skill is written              (output)
#   - set the skill's frontmatter name                     (skill_name)
#   - communicate a length budget to Claude                (target_tokens)
#   - tell Claude how to handle markup / format             (latex_policy or
#                                                           format_policy)
#
# LOCAL-ONLY ENTRIES. profiles.local.yaml (gitignored) is merged over this
# file. Put any corpus or profile that must stay off GitHub there, for example
# another author's voice. Its built skill should write under corpora/<name>/ so
# the skill stays untracked too.
#
# The per-profile refinement flag in a corpus_state.yaml is
# `refined_into_skill_<profile>`, so building one skill never marks documents
# as incorporated into another.
#
# `default_profile` is used when --profile is omitted on the CLI.
# ---------------------------------------------------------------------------

default_profile: paper

corpora:

  wolf:
    root: corpora/wolf
    description: Eric Wolf's scientific writing (planetary climate / exoplanets).
    doc_types: [journal_paper, proposal, research_statement, letter_of_rec,
                review_perspective, technical_email, other]
    default_type_for_suffix:
      .pdf: journal_paper
      .txt: technical_email
    dimensions: core/EVALUATION_DIMENSIONS.md
    extraction_template: templates/extraction_prompt.md
    extraction_mode: per_document

profiles:

  paper:
    corpus: wolf
    skill_name: paper-voice
    purpose: >
      Formal journal-paper and proposal manuscript writing, invoked by Claude
      Code when editing a GitHub-backed Overleaf project containing LaTeX, .bib,
      and figure files. The same skill is also uploaded to claude.ai and used
      there for professional emails, letters, and statements; Claude Code loads
      claude.ai account skills too, so one skill covers both rather than two
      competing copies. The voice is learned from manuscripts only.
    # Source corpus: the formal, manuscript register only. Emails, letters, and
    # statements are deliberately excluded — that "personal touch" register is
    # not the target and is better left to the author.
    corpus_types:
      - journal_paper
      - proposal
    synthesis_template: templates/synthesis_paper.md
    output: skills/paper/SKILL.md
    # Slim target. The general-purpose SKILL.md ran ~7000 tokens; this profile
    # aims much lower so it is cheap to load on every Claude Code edit.
    target_tokens: 3000
    # defer: do NOT prescribe LaTeX or .bib syntax conventions in the skill.
    # Claude applies its own standard best practices for \citep/\citet, math
    # environments, captions, sectioning, etc. The skill governs PROSE VOICE and
    # ARGUMENT STRUCTURE, not markup mechanics.
    latex_policy: defer
